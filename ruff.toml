# Applies to new code in tools/. Supplied oracle scripts are excluded to keep them
# byte-identical to the ZIP; FILE_HASHES.json records their digests.
line-length = 100
target-version = "py312"
include = ["tools/**/*.py"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PL", "S", "BLE", "TRY", "PTH", "N"]
ignore = [
  "PLR2004", # chess constants (e.g. halfmove limits) are clearer inline
]
