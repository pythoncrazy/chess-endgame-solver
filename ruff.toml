# Applies to new code in tools/. This file excludes the supplied oracle scripts.
# Thus their code stays as in the ZIP. FILE_HASHES.json records the digests of the ZIP files.
line-length = 100
target-version = "py312"
include = ["tools/**/*.py"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PL", "S", "BLE", "TRY", "PTH", "N"]
ignore = [
  "PLR2004", # chess constants (for example, halfmove limits) are clearer inline
]
