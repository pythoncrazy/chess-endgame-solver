[package]
name = "tablebase-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
blake2 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
xz2 = "0.1"
lru = "0.16"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
