[package]
name = "tablebase-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace]

[dependencies]
tablebase-core = { path = ".." }
shakmaty = { git = "https://github.com/niklasf/shakmaty", rev = "fd6296926137d89192c7810a0894346a03f749ef" }
shakmaty-syzygy = { git = "https://github.com/niklasf/shakmaty", rev = "fd6296926137d89192c7810a0894346a03f749ef" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lru = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"], optional = true }

[features]
default = []
http = ["dep:reqwest"]

[profile.release]
lto = false
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
