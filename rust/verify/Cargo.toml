[package]
name = "tablebase-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

# Independent workspace: the solver crates do not depend on shakmaty.
[workspace]

[dependencies]
tablebase-core = { path = ".." }
shakmaty = { git = "https://github.com/niklasf/shakmaty", rev = "fd6296926137d89192c7810a0894346a03f749ef" }
shakmaty-syzygy = { git = "https://github.com/niklasf/shakmaty", rev = "fd6296926137d89192c7810a0894346a03f749ef" }
serde_json = "1"

[profile.release]
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
