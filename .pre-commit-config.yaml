# prek (https://github.com/j178/prek) hooks.
# To install the hooks, run `prek install`. To run all hooks, run `prek run --all-files`.
# Python lint and format apply to tools/. The hooks check the three Rust workspaces.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: strip-trailers
        name: remove co-author and tool trailers
        language: system
        entry: uv run --no-project python tools/strip_trailers.py
        stages: [commit-msg]
      - id: ruff-check
        name: ruff check (tools)
        language: system
        entry: uv run --frozen ruff check --force-exclude
        types: [python]
        files: ^tools/
      - id: ruff-format
        name: ruff format (tools)
        language: system
        entry: uv run --frozen ruff format --check --force-exclude
        types: [python]
        files: ^tools/
      - id: cargo-fmt
        name: cargo fmt (core, verify, gpu)
        language: system
        entry: bash -c 'for m in rust/Cargo.toml rust/verify/Cargo.toml rust/gpu/Cargo.toml; do cargo fmt --manifest-path "$m" --check || exit 1; done'
        pass_filenames: false
        files: ^rust/.*\.rs$
      - id: clippy-core
        name: clippy -D warnings (core)
        language: system
        entry: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
        pass_filenames: false
        files: ^rust/(src|tests|Cargo)
      - id: clippy-verify
        name: clippy -D warnings (verify)
        language: system
        entry: cargo clippy --locked --manifest-path rust/verify/Cargo.toml --all-targets -- -D warnings
        pass_filenames: false
        files: ^rust/(verify/|src/)
      - id: clippy-gpu
        name: clippy -D warnings (gpu, with the CUDA toolkit)
        language: system
        entry: bash -c 'CUDA_TOOLKIT_PATH="${CUDA_TOOLKIT_PATH:-/usr/local/cuda-13.3}" cargo clippy --locked --release --manifest-path rust/gpu/Cargo.toml --all-targets -- -D warnings'
        pass_filenames: false
        files: ^rust/(gpu/|src/)
